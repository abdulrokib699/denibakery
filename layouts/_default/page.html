<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ .Title }} | Deni Bakery</title>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}" />
</head>
<body>

  <!-- ══════════════ NAVBAR ══════════════ -->
  <nav id="navbar">
    <div class="nav-inner">
      <a href="/" class="logo">
        <div class="logo-icon">🥐</div>
        <span class="logo-text">Deni <span>Bakery</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="/">Beranda</a></li>
        <li><a href="/menu/">Menu</a></li>
        <li><a href="/tentang/">Tentang Kami</a></li>
        <li><a href="/galeri/">Galeri</a></li>
        <li><a href="/kontak/">Kontak</a></li>
      </ul>
      <button class="hamburger" id="hamburger" aria-label="Buka Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="mobile-menu" id="mobile-menu">
      <a href="/">Beranda</a>
      <a href="/menu/">Menu</a>
      <a href="/tentang/">Tentang Kami</a>
      <a href="/galeri/">Galeri</a>
      <a href="/kontak/">Kontak</a>
    </div>
  </nav>

  <main class="page-content" style="min-height: 60vh; padding: 4rem 2rem; max-width: 1200px; margin: 0 auto;">
    <h1>{{ .Title }}</h1>
    <div class="page-body">
      {{ .Content }}
    </div>
  </main>

  <!-- ══════════════ FOOTER ══════════════ -->
  <footer>
    <div class="footer-inner">
      <div class="footer-logo">Deni <span>Bakery</span></div>
      <div class="footer-tagline">Roti Lezat, Dibuat dengan Cinta — Jember, Jawa Timur</div>
      <div class="footer-links">
        <a href="/">Beranda</a>
        <a href="/menu/">Menu</a>
        <a href="/tentang/">Tentang Kami</a>
        <a href="/galeri/">Galeri</a>
        <a href="/kontak/">Kontak</a>
      </div>
      <div class="footer-copy">© 2024 Deni Bakery. Semua hak dilindungi.</div>
    </div>
  </footer>

  <script src="{{ "js/main.js" | relURL }}"></script>
</body>
</html>
